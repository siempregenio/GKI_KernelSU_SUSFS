name: Build Kernels

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Release Type"
        type: choice
        options:
          - Action
          - Pre-Release
          - Release
        default: Action
      use_cache:
        description: "Use ccache/bazel cache (restore/save)"
        type: boolean
        default: true
      bypass:
        description: "Apply kernel version-check bypass hack"
        type: boolean
        default: false
      kernel_build_version:
        description: "Kernel Version"
        type: choice
        options:
          - All
          - 5.10.x-android12
          - 5.10.x-android13
          - 5.15.x-android13
          - 5.15.x-android14
          - 6.1.x-android14
          - 6.6.x-android15
          - 6.12.x-android16
          - 6.18.x-android17
        default: All
      os_patch_level:
        description: "Patch date (YYYY-MM), kernel sublevel, lts, or All (no filter)"
        required: true
        type: string
        default: All
      brand_name:
        description: "Kernel Branding"
        type: string
        default: Wild
      commit_mode:
        description: "latest = branch tips, verified = audited pins, update = build latest then promote verified pins on success"
        required: false
        type: choice
        options:
          - latest
          - verified
          - update
        default: verified
      root_flavor:
        description: "Root Flavor"
        type: choice
        options:
          - KernelSU-Next
          - KernelSU
          - ReSukiSU
          - SukiSU-Ultra
          - KowSU
          - No Root
          - All
        default: All
      use_susfs:
        description: "SUSFS"
        type: boolean
        default: true
      use_nomount:
        description: "NoMount"
        type: boolean
        default: true
      use_bbg:
        description: "Baseband Guard"
        type: boolean
        default: true
      use_net:
        description: "Networking"
        type: boolean
        default: true
      use_ds:
        description: "DroidSpaces"
        type: boolean
        default: true
      use_ntsync:
        description: "NTSync"
        type: boolean
        default: true
      use_ptrace:
        description: "Ptrace Patch"
        type: boolean
        default: true
      use_unicode:
        description: "Unicode Fix"
        type: boolean
        default: true
      use_bpf:
        description: "BPF Stack (BTF + eBPF + FUSE-BPF)"
        type: boolean
        default: true
      use_perf:
        description: "Performance"
        type: boolean
        default: false
      test_release_notes:
        description: "Render release notes preview only (skip all builds + release)"
        type: boolean
        default: false

jobs:
  resolve-sources:
    runs-on: ubuntu-latest
    outputs:
      nomount_commit: ${{ steps.resolve.outputs.nomount_commit }}
      kernelsu_commit: ${{ steps.resolve.outputs.kernelsu_commit }}
      kernelsu_branch: ${{ steps.resolve.outputs.kernelsu_branch }}
      root_flavor: ${{ steps.resolve.outputs.root_flavor }}
      root_commit: ${{ steps.resolve.outputs.root_commit }}
      root_matrix: ${{ steps.resolve.outputs.root_matrix }}
      susfs_commit_android12_5_10: ${{ steps.resolve.outputs.susfs_commit_android12_5_10 }}
      susfs_commit_android13_5_10: ${{ steps.resolve.outputs.susfs_commit_android13_5_10 }}
      susfs_commit_android13_5_15: ${{ steps.resolve.outputs.susfs_commit_android13_5_15 }}
      susfs_commit_android14_5_15: ${{ steps.resolve.outputs.susfs_commit_android14_5_15 }}
      susfs_commit_android14_6_1: ${{ steps.resolve.outputs.susfs_commit_android14_6_1 }}
      susfs_commit_android15_6_6: ${{ steps.resolve.outputs.susfs_commit_android15_6_6 }}
      susfs_commit_android16_6_12: ${{ steps.resolve.outputs.susfs_commit_android16_6_12 }}
      susfs_commit_android17_6_18: ${{ steps.resolve.outputs.susfs_commit_android17_6_18 }}
      susfs_commit_android12_5_10_resukisu: ${{ steps.resolve.outputs.susfs_commit_android12_5_10_resukisu }}
      susfs_commit_android13_5_10_resukisu: ${{ steps.resolve.outputs.susfs_commit_android13_5_10_resukisu }}
      susfs_commit_android13_5_15_resukisu: ${{ steps.resolve.outputs.susfs_commit_android13_5_15_resukisu }}
      susfs_commit_android14_5_15_resukisu: ${{ steps.resolve.outputs.susfs_commit_android14_5_15_resukisu }}
      susfs_commit_android14_6_1_resukisu: ${{ steps.resolve.outputs.susfs_commit_android14_6_1_resukisu }}
      susfs_commit_android15_6_6_resukisu: ${{ steps.resolve.outputs.susfs_commit_android15_6_6_resukisu }}
      susfs_commit_android16_6_12_resukisu: ${{ steps.resolve.outputs.susfs_commit_android16_6_12_resukisu }}
      susfs_commit_android17_6_18_resukisu: ${{ steps.resolve.outputs.susfs_commit_android17_6_18_resukisu }}
      susfs_commit_android12_5_10_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android12_5_10_sukisu_ultra }}
      susfs_commit_android13_5_10_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android13_5_10_sukisu_ultra }}
      susfs_commit_android13_5_15_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android13_5_15_sukisu_ultra }}
      susfs_commit_android14_5_15_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android14_5_15_sukisu_ultra }}
      susfs_commit_android14_6_1_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android14_6_1_sukisu_ultra }}
      susfs_commit_android15_6_6_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android15_6_6_sukisu_ultra }}
      susfs_commit_android16_6_12_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android16_6_12_sukisu_ultra }}
      susfs_commit_android17_6_18_sukisu_ultra: ${{ steps.resolve.outputs.susfs_commit_android17_6_18_sukisu_ultra }}
      ksu_commit: ${{ steps.resolve.outputs.ksu_commit }}
      resukisu_commit: ${{ steps.resolve.outputs.resukisu_commit }}
      sukisu_ultra_commit: ${{ steps.resolve.outputs.sukisu_ultra_commit }}
      kowsu_commit: ${{ steps.resolve.outputs.kowsu_commit }}
      kernel_patches_commit: ${{ steps.resolve.outputs.kernel_patches_commit }}
      anykernel3_commit: ${{ steps.resolve.outputs.anykernel3_commit }}
      droidspaces_commit: ${{ steps.resolve.outputs.droidspaces_commit }}
      feature_set: ${{ steps.features.outputs.feature_set }}
      manager_list: ${{ steps.manager.outputs.manager_list }}
    steps:
      - name: Resolve latest component commits
        id: resolve
        shell: bash
        run: |
          set -euo pipefail

          COMMIT_MODE="${{ inputs.commit_mode || 'verified' }}"
          echo "commit_mode=${COMMIT_MODE}"

          retry() {
            local n=0
            until [ "$n" -ge 5 ]; do
              "$@" && return 0
              n=$((n+1))
              echo "retry $n/5 failed for: $*" >&2
              sleep 5
            done
            return 1
          }

          resolve_sha() { # repo ref
            retry git ls-remote "$1" "$2" | awk '{print $1; exit}'
          }

          emit() { # key value
            if [ -z "$2" ] || ! [[ "$2" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Failed to resolve $1 (got: ${2:-empty})" >&2
              exit 1
            fi
            echo "$1=$2" >> "$GITHUB_OUTPUT"
          }

          PIN_NOMOUNT="d0f57d5c37ff02aae2299daded57919153240cb3"
          PIN_KERNELSU="3c1240625655978f319a98398031100b80e9da7c"
          PIN_RESUKISU="3c1882886dbbb54f4aae7ddf205f8ccde32c2a34"
          PIN_SUKISU_ULTRA="e2912817f4e1b194e582a06e0b5eacf6a3fb7083"
          declare -A PIN_SUSFS=(
            [susfs_commit_android12_5_10]="ec785f47d49f7b3871ca9356f450411020af7017"
            [susfs_commit_android13_5_10]="ed3d6d9c9a2652e1c70f153f5358701e996d646c"
            [susfs_commit_android13_5_15]="bca0d2333c1a7d717e7278b019d7af7ba1d16005"
            [susfs_commit_android14_5_15]="d54b51724afa912c4c99bb99731354ce934d1889"
            [susfs_commit_android14_6_1]="4fc9c1898ea66f51847cdbc0d1473ea4ef525a70"
            [susfs_commit_android15_6_6]="937215cb3a1b1f333d764c366c7a49972fa8e7a0"
            [susfs_commit_android16_6_12]="7d91da2d2ce056d1abf378d9199aaf1072d37ab0"
            [susfs_commit_android17_6_18]="7d91da2d2ce056d1abf378d9199aaf1072d37ab1"
          )
          declare -A PIN_SUSFS_RESUKISU=(
            [susfs_commit_android12_5_10]="ec785f47d49f7b3871ca9356f450411020af7017"
            [susfs_commit_android13_5_10]="ed3d6d9c9a2652e1c70f153f5358701e996d646c"
            [susfs_commit_android13_5_15]="bca0d2333c1a7d717e7278b019d7af7ba1d16005"
            [susfs_commit_android14_5_15]="d54b51724afa912c4c99bb99731354ce934d1889"
            [susfs_commit_android14_6_1]="4fc9c1898ea66f51847cdbc0d1473ea4ef525a70"
            [susfs_commit_android15_6_6]="937215cb3a1b1f333d764c366c7a49972fa8e7a0"
            [susfs_commit_android16_6_12]="7d91da2d2ce056d1abf378d9199aaf1072d37ab0"
            [susfs_commit_android17_6_18]="7d91da2d2ce056d1abf378d9199aaf1072d37ab1"
          )
          declare -A PIN_SUSFS_SUKISU_ULTRA=(
            [susfs_commit_android12_5_10]="ec785f47d49f7b3871ca9356f450411020af7017"
            [susfs_commit_android13_5_10]="ed3d6d9c9a2652e1c70f153f5358701e996d646c"
            [susfs_commit_android13_5_15]="bca0d2333c1a7d717e7278b019d7af7ba1d16005"
            [susfs_commit_android14_5_15]="d54b51724afa912c4c99bb99731354ce934d1889"
            [susfs_commit_android14_6_1]="4fc9c1898ea66f51847cdbc0d1473ea4ef525a70"
            [susfs_commit_android15_6_6]="937215cb3a1b1f333d764c366c7a49972fa8e7a0"
            [susfs_commit_android16_6_12]="7d91da2d2ce056d1abf378d9199aaf1072d37ab0"
            [susfs_commit_android17_6_18]="7d91da2d2ce056d1abf378d9199aaf1072d37ab1"
          )

          pick() {
            local pinned="$1" repo="$2" ref="$3"
            if [ "$COMMIT_MODE" = "verified" ] && [ -n "$pinned" ]; then
              echo "$pinned"
            else
              resolve_sha "$repo" "$ref"
            fi
          }

          emit nomount_commit "$(pick "$PIN_NOMOUNT" https://github.com/maxsteeel/nomount.git refs/heads/dev)"
          emit kernelsu_commit "$(resolve_sha https://github.com/KernelSU-Next/KernelSU-Next.git refs/heads/dev)"
          echo "kernelsu_branch=dev" >> "$GITHUB_OUTPUT"

          if [ "${{ inputs.use_susfs }}" = "true" ]; then
            KERNELSU_COMMIT="$(pick "$PIN_KERNELSU" https://github.com/tiann/KernelSU.git refs/heads/main)"
            RESUKISU_COMMIT="$(pick "$PIN_RESUKISU" https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main)"
            SUKISU_ULTRA_COMMIT="$(pick "$PIN_SUKISU_ULTRA" https://github.com/SukiSU-Ultra/SukiSU-Ultra.git refs/heads/builtin)"
          else
            KERNELSU_COMMIT="$(resolve_sha https://github.com/tiann/KernelSU.git refs/heads/main)"
            RESUKISU_COMMIT="$(resolve_sha https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main)"
            SUKISU_ULTRA_COMMIT="$(resolve_sha https://github.com/SukiSU-Ultra/SukiSU-Ultra.git refs/heads/main)"
          fi
          emit ksu_commit "$KERNELSU_COMMIT"
          emit resukisu_commit "$RESUKISU_COMMIT"
          emit sukisu_ultra_commit "$SUKISU_ULTRA_COMMIT"

          KOWSU_COMMIT="$(resolve_sha https://github.com/KOWX712/KernelSU.git refs/heads/master)"
          emit kowsu_commit "$KOWSU_COMMIT"
          if [ "${{ inputs.use_susfs }}" = "true" ]; then
            NEXT_COMMIT="$(resolve_sha https://github.com/pershoot/KernelSU-Next.git refs/heads/dev-susfs)"
          else
            NEXT_COMMIT="$(resolve_sha https://github.com/KernelSU-Next/KernelSU-Next.git refs/heads/dev)"
          fi

          mk_entry() {
            printf '{"root_flavor":"%s","variant":"%s","root_commit":"%s"}' "$1" "$2" "$3"
          }

          case "${{ inputs.root_flavor || 'All' }}" in
            KernelSU)
              echo "root_flavor=kernelsu" >> "$GITHUB_OUTPUT"
              emit root_commit "$KERNELSU_COMMIT"
              ROOT_MATRIX="[$(mk_entry kernelsu KernelSU "$KERNELSU_COMMIT")]"
              ;;
            KernelSU-Next)
              echo "root_flavor=next" >> "$GITHUB_OUTPUT"
              emit root_commit "$NEXT_COMMIT"
              ROOT_MATRIX="[$(mk_entry next KernelSU-Next "$NEXT_COMMIT")]"
              ;;
            ReSukiSU)
              echo "root_flavor=resukisu" >> "$GITHUB_OUTPUT"
              emit root_commit "$RESUKISU_COMMIT"
              ROOT_MATRIX="[$(mk_entry resukisu ReSukiSU "$RESUKISU_COMMIT")]"
              ;;
            SukiSU-Ultra)
              echo "root_flavor=sukisu-ultra" >> "$GITHUB_OUTPUT"
              emit root_commit "$SUKISU_ULTRA_COMMIT"
              ROOT_MATRIX="[$(mk_entry sukisu-ultra SukiSU-Ultra "$SUKISU_ULTRA_COMMIT")]"
              ;;
            KowSU)
              if [ "${{ inputs.use_susfs }}" = "true" ]; then
                echo "ERROR: KowSU does not work together with SUSFS — re-run with SUSFS off." >&2
                exit 1
              fi
              echo "root_flavor=kowsu" >> "$GITHUB_OUTPUT"
              emit root_commit "$KOWSU_COMMIT"
              ROOT_MATRIX="[$(mk_entry kowsu KowSU "$KOWSU_COMMIT")]"
              ;;
            "No Root")
              echo "root_flavor=none" >> "$GITHUB_OUTPUT"
              echo "root_commit=" >> "$GITHUB_OUTPUT"
              ROOT_MATRIX='[{"root_flavor":"none","variant":"NoRoot","root_commit":""}]'
              ;;
            All)
              ROOT_MATRIX="[$(mk_entry next KernelSU-Next "$NEXT_COMMIT"),$(mk_entry kernelsu KernelSU "$KERNELSU_COMMIT"),$(mk_entry resukisu ReSukiSU "$RESUKISU_COMMIT")]"
              echo "root_flavor=" >> "$GITHUB_OUTPUT"
              echo "root_commit=" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "ERROR: unknown root_flavor '${{ inputs.root_flavor }}'" >&2
              exit 1
              ;;
          esac
          echo "root_matrix=$ROOT_MATRIX" >> "$GITHUB_OUTPUT"

          declare -A SUSFS_BRANCHES=(
            [susfs_commit_android12_5_10]="gki-android12-5.10"
            [susfs_commit_android13_5_10]="gki-android13-5.10"
            [susfs_commit_android13_5_15]="gki-android13-5.15"
            [susfs_commit_android14_5_15]="gki-android14-5.15"
            [susfs_commit_android14_6_1]="gki-android14-6.1"
            [susfs_commit_android15_6_6]="gki-android15-6.6"
            [susfs_commit_android16_6_12]="gki-android16-6.12"
            [susfs_commit_android17_6_18]="gki-android17-6.18"
          )
          for key in "${!SUSFS_BRANCHES[@]}"; do
            emit "$key" "$(pick "${PIN_SUSFS[$key]}" https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/${SUSFS_BRANCHES[$key]})"
            emit "${key}_resukisu" "$(pick "${PIN_SUSFS_RESUKISU[$key]}" https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/${SUSFS_BRANCHES[$key]})"
            emit "${key}_sukisu_ultra" "$(pick "${PIN_SUSFS_SUKISU_ULTRA[$key]}" https://gitlab.com/simonpunk/susfs4ksu.git refs/heads/${SUSFS_BRANCHES[$key]})"
          done

          emit kernel_patches_commit "$(resolve_sha https://github.com/WildKernels/kernel_patches.git refs/heads/main)"
          emit anykernel3_commit "$(resolve_sha https://github.com/WildKernels/AnyKernel3.git refs/heads/gki-2.0)"
          emit droidspaces_commit "$(resolve_sha https://github.com/ravindu644/Droidspaces-OSS.git refs/heads/main)"

      - name: Resolve manager builds for selected root flavor(s)
        id: manager
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          resolve_one() {
            local flavor="$1"
            local owner repo wf stock
            case "$flavor" in
              next)
                owner="KernelSU-Next"; repo="KernelSU-Next"; wf="build-manager-ci.yml"
                stock="${{ steps.resolve.outputs.kernelsu_commit }}"
                run_id=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?head_sha=${stock}" \
                  --jq '.workflow_runs[0].id // empty')
                if [[ -z "${run_id}" ]]; then
                  fb=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?branch=dev&status=success&per_page=1")
                  run_id=$(echo "$fb" | jq -r '.workflow_runs[0].id // empty')
                  stock=$(echo "$fb" | jq -r '.workflow_runs[0].head_sha // empty')
                  if [[ -z "${run_id}" ]]; then exit 1; fi
                fi
                printf '{"flavor":"%s","owner":"%s","repo":"%s","source":"run","run_id":%s,"stock":"%s","want":"manager,manager-spoofed"}' \
                  "$flavor" "$owner" "$repo" "$run_id" "$stock"
                ;;
              kernelsu)
                owner="tiann"; repo="KernelSU"; wf="build-manager.yml"
                stock=$(git ls-remote https://github.com/tiann/KernelSU.git refs/heads/main | awk '{print $1; exit}')
                run_id=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?head_sha=${stock}" \
                  --jq '.workflow_runs[0].id // empty')
                if [[ -z "${run_id}" ]]; then
                  fb=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?branch=main&status=success&per_page=1")
                  run_id=$(echo "$fb" | jq -r '.workflow_runs[0].id // empty')
                  stock=$(echo "$fb" | jq -r '.workflow_runs[0].head_sha // empty')
                  if [[ -z "${run_id}" ]]; then exit 1; fi
                fi
                printf '{"flavor":"%s","owner":"%s","repo":"%s","source":"run","run_id":%s,"stock":"%s","want":"manager"}' \
                  "$flavor" "$owner" "$repo" "$run_id" "$stock"
                ;;
              resukisu)
                owner="ReSukiSU"; repo="ReSukiSU"; wf="build-manager.yml"
                stock=$(git ls-remote https://github.com/ReSukiSU/ReSukiSU.git refs/heads/main | awk '{print $1; exit}')
                run_id=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?head_sha=${stock}" \
                  --jq '.workflow_runs[0].id // empty')
                if [[ -z "${run_id}" ]]; then
                  fb=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?branch=main&status=success&per_page=1")
                  run_id=$(echo "$fb" | jq -r '.workflow_runs[0].id // empty')
                  stock=$(echo "$fb" | jq -r '.workflow_runs[0].head_sha // empty')
                  if [[ -z "${run_id}" ]]; then exit 1; fi
                fi
                printf '{"flavor":"%s","owner":"%s","repo":"%s","source":"run","run_id":%s,"stock":"%s","want":"Manager-release,Spoofed-Manager-release"}' \
                  "$flavor" "$owner" "$repo" "$run_id" "$stock"
                ;;
              sukisu-ultra)
                owner="SukiSU-Ultra"; repo="SukiSU-Ultra"; wf="build-manager.yml"
                stock=$(git ls-remote https://github.com/SukiSU-Ultra/SukiSU-Ultra.git refs/heads/main | awk '{print $1; exit}')
                run_id=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?head_sha=${stock}" \
                  --jq '.workflow_runs[0].id // empty')
                if [[ -z "${run_id}" ]]; then
                  fb=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?branch=main&status=success&per_page=1")
                  run_id=$(echo "$fb" | jq -r '.workflow_runs[0].id // empty')
                  stock=$(echo "$fb" | jq -r '.workflow_runs[0].head_sha // empty')
                  if [[ -z "${run_id}" ]]; then exit 1; fi
                fi
                printf '{"flavor":"%s","owner":"%s","repo":"%s","source":"run","run_id":%s,"stock":"%s","want":"Manager,Spoofed-Manager"}' \
                  "$flavor" "$owner" "$repo" "$run_id" "$stock"
                ;;
              kowsu)
                owner="KOWX712"; repo="KernelSU"; wf="build-manager.yml"
                stock=$(git ls-remote https://github.com/KOWX712/KernelSU.git refs/heads/master | awk '{print $1; exit}')
                run_id=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?head_sha=${stock}" \
                  --jq '.workflow_runs[0].id // empty')
                if [[ -z "${run_id}" ]]; then
                  fb=$(gh api "repos/${owner}/${repo}/actions/workflows/${wf}/runs?branch=master&status=success&per_page=1")
                  run_id=$(echo "$fb" | jq -r '.workflow_runs[0].id // empty')
                  stock=$(echo "$fb" | jq -r '.workflow_runs[0].head_sha // empty')
                  if [[ -z "${run_id}" ]]; then exit 1; fi
                fi
                printf '{"flavor":"%s","owner":"%s","repo":"%s","source":"run","run_id":%s,"stock":"%s","want":"manager"}' \
                  "$flavor" "$owner" "$repo" "$run_id" "$stock"
                ;;
            esac
          }

          FLAVORS="${{ inputs.root_flavor || 'All' }}"
          LIST=""
          case "${FLAVORS}" in
            All) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one next)"$'\n'"$(resolve_one kernelsu)"$'\n'"$(resolve_one resukisu)") ;;
            KernelSU-Next) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one next)") ;;
            KernelSU) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one kernelsu)") ;;
            ReSukiSU) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one resukisu)") ;;
            SukiSU-Ultra) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one sukisu-ultra)") ;;
            KowSU) LIST=$(jq -c -n '[inputs]' <<< "$(resolve_one kowsu)") ;;
          esac
          if [ -n "$LIST" ]; then
            echo "manager_list=$LIST" >> "$GITHUB_OUTPUT"
          else
            echo "manager_list=[]" >> "$GITHUB_OUTPUT"
          fi

      - name: Compose requested feature set
        id: features
        shell: bash
        run: |
          set -euo pipefail
          FEATURES=""
          [ "${{ inputs.use_susfs }}" = "true" ] && FEATURES="${FEATURES}SUSFS+"
          [ "${{ inputs.use_nomount }}" = "true" ] && FEATURES="${FEATURES}NoMount+"
          [ "${{ inputs.use_bbg }}" = "true" ] && FEATURES="${FEATURES}BBG+"
          [ "${{ inputs.use_net }}" = "true" ] && FEATURES="${FEATURES}NET+"
          [ "${{ inputs.use_ds }}" = "true" ] && FEATURES="${FEATURES}DS+"
          [ "${{ inputs.use_ntsync }}" = "true" ] && FEATURES="${FEATURES}NTSync+"
          [ "${{ inputs.use_ptrace }}" = "true" ] && FEATURES="${FEATURES}Ptrace+"
          [ "${{ inputs.use_unicode }}" = "true" ] && FEATURES="${FEATURES}Unicode+"
          [ "${{ inputs.use_bpf }}" = "true" ] && FEATURES="${FEATURES}BPF+"
          [ "${{ inputs.use_perf }}" = "true" ] && FEATURES="${FEATURES}Perf+"
          echo "feature_set=${FEATURES%+}" >> "$GITHUB_OUTPUT"

      - name: Clone shared source repos once
        if: inputs.use_nomount && !inputs.test_release_notes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sources
          git clone --no-checkout https://github.com/maxsteeel/nomount.git sources/nomount
          git -C sources/nomount fetch --depth=1 origin "${{ steps.resolve.outputs.nomount_commit }}"
          git -C sources/nomount checkout --detach "${{ steps.resolve.outputs.nomount_commit }}"

  list-manager-apks:
    needs: resolve-sources
    if: "github.event_name == 'workflow_dispatch' && !inputs.test_release_notes && needs.resolve-sources.outputs.manager_list != ''"
    runs-on: ubuntu-latest
    outputs:
      apk_list: ${{ steps.scan.outputs.apk_list }}
    steps:
      - uses: actions/checkout@v4

      - name: Download and scan all manager APKs
        id: scan
        shell: bash
        env:
          MANAGER_LIST: ${{ needs.resolve-sources.outputs.manager_list }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MANAGER_LIST=$(echo "$MANAGER_LIST" | sed 's/^\[,/[/')
          OUT_APKS="${GITHUB_WORKSPACE:-$PWD}/manager_apks"
          MANIFEST="${GITHUB_WORKSPACE:-$PWD}/manifest.txt"
          mkdir -p "$OUT_APKS"
          : > "$MANIFEST"
          echo "$MANAGER_LIST" | jq -c '.[]' | while read -r M; do
            OWNER=$(echo "$M" | jq -r .owner)
            REPO=$(echo "$M" | jq -r .repo)
            SRC=$(echo "$M" | jq -r .source)
            RUN_ID=$(echo "$M" | jq -r .run_id)
            WANT=$(echo "$M" | jq -r '.want // ""')
            DLDIR="dl_${REPO}"
            mkdir -p "$DLDIR"
            (
              cd "$DLDIR"
              AJSON=$(curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
                -H "Authorization: Bearer ${GH_TOKEN}" \
                "https://api.github.com/repos/${OWNER}/${REPO}/actions/runs/${RUN_ID}/artifacts")
              if [ -z "$WANT" ]; then
                ART_IDS=$(echo "$AJSON" | jq -r '.artifacts[].id')
              else
                ART_IDS=$(echo "$AJSON" | jq -r --arg want "$WANT" '
                  ($want | split(",")) as $wl |
                  .artifacts[] | select(.name as $n | any($wl[]; $n == .)) | .id')
              fi
              echo "$ART_IDS" | while read -r AID; do
                [ -n "$AID" ] || continue
                curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors \
                  -H "Authorization: Bearer ${GH_TOKEN}" \
                  -o "_${AID}.zip" \
                  "https://api.github.com/repos/${OWNER}/${REPO}/actions/artifacts/${AID}/zip"
                mkdir -p "_${AID}"
                unzip -o -q "_${AID}.zip" -d "_${AID}" || true
                rm -f "_${AID}.zip"
                for apk in _${AID}/*.apk; do
                  [ -f "$apk" ] || continue
                  NAME="$(basename "$apk")"
                  cp -f "$apk" "$OUT_APKS/$NAME"
                  echo "$OWNER|$REPO|$NAME" >> "$MANIFEST"
                done
              done
            )
          done
